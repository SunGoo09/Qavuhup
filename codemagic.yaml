workflows:
  ios-app-store:
    name: iOS App Store IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: vn.edu.vanchuongphieuluuky
      vars:
        XCODE_PROJECT: ios/VanChuongPhieuLuuKy.xcodeproj
        XCODE_SCHEME: VanChuongPhieuLuuKy
      xcode: latest
    scripts:
      - name: Configure iOS signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
